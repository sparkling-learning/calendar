<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>認識月曆：日曆小管家</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-viewport">
    <!-- 頂部資訊列與正向提示 -->
    <header class="top-nav">
      <div class="nav-title-box">
        <span class="nav-icon">📅</span>
        <h1 class="nav-title">認識月曆：看月曆讀句子</h1>
      </div>
      <div id="feedback-banner" class="feedback-box" aria-live="polite">
        請在月曆中找出正確的卡片，拉到下方句子裡！
      </div>
      <div class="mode-toggle">
        <button id="btn-mode-easy" class="btn-toggle active">初階版（顏色提示）</button>
        <button id="btn-mode-hard" class="btn-toggle">進階版（無提示）</button>
      </div>
    </header>

    <!-- 主遊戲畫面 (iPad 橫向專用上下分層) -->
    <main class="main-stage">
      <!-- 放大版：主要月曆板面 (直接在月曆中取卡) -->
      <section class="calendar-stage">
        <div class="calendar-frame">
          <!-- 月曆頂部：年份與月份 -->
          <div class="cal-top-bar">
            <div class="cal-item-wrap">
              <span class="cal-guide-text">年份：</span>
              <div class="source-card card-year" id="card-year" data-type="year">
                <!-- JS 動態填入年份 -->
              </div>
            </div>
            <div class="cal-item-wrap">
              <span class="cal-guide-text">月份：</span>
              <div class="source-card card-month" id="card-month" data-type="month">
                <!-- JS 動態填入月份 -->
              </div>
            </div>
          </div>

          <!-- 月曆本體網格：星期列 + 日期格 -->
          <div class="cal-grid-plate" id="cal-grid-plate">
            <!-- 由 JS 動態生成星期列與日期網格 -->
          </div>
        </div>
      </section>

      <!-- 下方目標區：完整句子填空 -->
      <section class="sentence-stage">
        <div class="sentence-card">
          <div class="sentence-instruction">🗣️ 請把月曆上的字卡拖進句子空格裡，完成後一起朗讀：</div>
          <div class="sentence-row">
            <span class="sentence-prefix">今天是</span>
            
            <div class="sentence-slot slot-year" id="target-year" data-type="year">
              <span class="slot-placeholder">____年</span>
            </div>

            <div class="sentence-slot slot-month" id="target-month" data-type="month">
              <span class="slot-placeholder">____月</span>
            </div>

            <div class="sentence-slot slot-day" id="target-day" data-type="day">
              <span class="slot-placeholder">____日</span>
            </div>

            <div class="sentence-slot slot-weekday" id="target-weekday" data-type="weekday">
              <span class="slot-placeholder">星期____</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 正向激勵全關完成彈窗 -->
  <div id="modal-celebrate" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <div class="badge-icon">🌟 🎉 🌟</div>
      <h2 class="badge-title">太棒了！你完成了今天的日曆！</h2>
      <p class="badge-desc" id="celebrate-text">你看得好專注，學會了自己閱讀月曆！</p>
      <button id="btn-restart" class="btn-action-primary">再玩一次 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
