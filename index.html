<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>認識今天與今天心情 - 日曆小管家</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <!-- 頂部導航與難度控制 -->
    <header class="game-header">
      <h1 class="title" id="page-title">📅 認識今天：日曆小管家</h1>
      <div class="header-controls">
        <div class="difficulty-toggle">
          <button id="btn-mode-easy" class="mode-btn active">初階版</button>
          <button id="btn-mode-hard" class="mode-btn">進階版</button>
        </div>
      </div>
      <p class="subtitle" id="page-subtitle">把正確的「年份、月份、日期、星期」放進日曆裡吧！</p>
    </header>

    <!-- 正向回饋提示列 -->
    <div id="feedback-banner" class="feedback-banner" aria-live="polite">請選擇卡片放入日曆中！</div>

    <!-- ===== 第一頁：認識日期與朗讀 ===== -->
    <section id="page-date" class="page-section">
      <div class="calendar-board">
        <div class="calendar-top">
          <div class="slot-box" id="box-year">
            <span class="slot-label">年份</span>
            <div class="drop-zone" id="slot-year" data-type="year">拖到這裡</div>
          </div>
          <div class="slot-box" id="box-month">
            <span class="slot-label">月份</span>
            <div class="drop-zone" id="slot-month" data-type="month">拖到這裡</div>
          </div>
        </div>

        <div class="calendar-middle">
          <div class="slot-box large" id="box-day">
            <span class="slot-label">日期</span>
            <div class="drop-zone day-zone" id="slot-day" data-type="day">拖到這裡</div>
          </div>
        </div>

        <div class="calendar-bottom">
          <div class="slot-box" id="box-weekday">
            <span class="slot-label">星期</span>
            <div class="drop-zone" id="slot-weekday" data-type="weekday">拖到這裡</div>
          </div>
        </div>

        <!-- 迷你日曆預覽 -->
        <div class="mini-calendar-preview">
          <div class="mini-cal-title" id="p1-cal-title">日曆底板</div>
          <div class="mini-cal-grid" id="p1-cal-grid"></div>
        </div>
      </div>

      <!-- 朗讀句子互動區 -->
      <div id="reading-box" class="reading-box hidden">
        <div class="reading-hint">🗣️ 點擊字詞一起朗讀，觀察日曆哪裡在發光：</div>
        <div class="sentence-row">
          <span>今天是</span>
          <button class="word-btn" data-target="year" id="word-year">____年</button>
          <button class="word-btn" data-target="month" id="word-month">____月</button>
          <button class="word-btn" data-target="day" id="word-day">____日</button>
          <button class="word-btn" data-target="weekday" id="word-weekday">星期____</button>
        </div>
        <button id="btn-goto-mood" class="btn-next hidden">下一頁：今天的心情 ➡️</button>
      </div>

      <!-- 日期待選卡片區 -->
      <div class="deck-container" id="date-deck-container">
        <div class="deck-header">✨ 請拖曳或點選卡片：</div>
        <div class="cards-deck" id="date-cards-deck"></div>
      </div>
    </section>

    <!-- ===== 第二頁：今天的心情 EMOJI ===== -->
    <section id="page-mood" class="page-section hidden">
      <div class="calendar-board mood-board">
        <div class="cal-header-label" id="p2-cal-title">本月日曆底板</div>
        <div class="mood-calendar-grid" id="p2-cal-grid"></div>
      </div>

      <!-- 心情 EMOJI 選項區 -->
      <div class="deck-container">
        <div class="deck-header">💖 請把今天的心情拉進今天的格子裡：</div>
        <div class="emoji-deck" id="emoji-deck"></div>
      </div>
    </section>
  </div>

  <!-- 全關完成正向彈窗 -->
  <div id="modal-success" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-icon">🌟🎉🌟</div>
      <h2 class="modal-title">太棒了！你完成了今天的日曆！</h2>
      <p class="modal-desc" id="modal-desc">你看得好專注，每一步都做得非常出色！</p>
      <button id="btn-restart" class="btn-primary">再玩一次 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
